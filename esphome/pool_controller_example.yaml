esphome:
  name: pool_controller
  platform: ESP32
  board: esp32-s3-eth-8di-8ro

external_components:
  - source: local
    path: custom_components/atlas_ezo_ph
  - source: local
    path: custom_components/pool_ph_controller

includes:
  - custom_components/atlas_ezo_ph/atlas_ezo_ph.h
  - custom_components/pool_ph_controller/ph_controller.h

globals:
  - id: pool_ph_sensor
    type: pool_controller::AtlasEzoPhSensor *
    restore_value: no
    initial_value: 'nullptr'
  - id: pool_pump_switch
    type: switch_::Switch *
    restore_value: no
    initial_value: 'nullptr'
  - id: pool_ph_controller
    type: pool_controller::PoolPhController *
    restore_value: no
    initial_value: 'nullptr'

i2c:
  sda: 21
  scl: 22
  scan: true

output:
  - platform: gpio
    pin: 25
    id: pool_acid_pump_output

wifi:
  ssid: "YOUR_SSID"
  password: "YOUR_PASSWORD"

logger:
  level: DEBUG

api:

ota:

# Create and register the Atlas probe via YAML
atlas_ezo_ph:
  - id: pool_ph_sensor
    address: 0x63
    update_interval: 15000

# PH controller component - exposes sensors/binary sensors itself
pool_ph_controller:
  - id: pool_ph_controller
    update_interval: 15000
    pump_switch: pool_pump_switch
    current_ph_sensor:
      name: "Pool Controller Current pH"
    target_ph_sensor:
      name: "Pool Controller Target pH"
    pool_volume_sensor:
      name: "Pool Controller Pool Volume"
      unit_of_measurement: "L"
    tac_sensor:
      name: "Pool Controller TAC"
      unit_of_measurement: "mg/L"
    acid_strength_sensor:
      name: "Pool Controller Acid Strength"
      unit_of_measurement: "%"
    dosing_flowrate_sensor:
      name: "Pool Controller Dosing Flowrate"
      unit_of_measurement: "mL/min"
    max_acid_sensor:
      name: "Pool Controller Max Acid Per Day"
      unit_of_measurement: "mL"
    mixing_delay_sensor:
      name: "Pool Controller Mixing Delay"
      unit_of_measurement: "min"
    daily_acid_used_sensor:
      name: "Pool Controller Acid Used Today"
      unit_of_measurement: "mL"
    acid_ml_needed_sensor:
      name: "Pool Controller Acid Needed"
      unit_of_measurement: "mL"
    pool_pump_running_binary_sensor:
      name: "Pool Pump Running"
    acid_dosing_binary_sensor:
      name: "Pool Acid Dosing Enabled"

# Bridge the hardware probe sensor to the controller by publishing probe readings into the controller
sensor:
  - platform: custom
    lambda: |-
      return {id(pool_ph_sensor)};
    sensors:
      - name: "Pool pH"
        unit_of_measurement: "pH"
        icon: "mdi:flask"
        on_value:
          then:
            - lambda: |-
                id(pool_ph_controller)->set_current_ph(x);

template:
  - number:
      name: "Pool Target pH"
      id: pool_target_ph
      icon: "mdi:target"
      min_value: 6.0
      max_value: 9.0
      step: 0.05
      update_interval: 10s
      lambda: |-
        return id(pool_ph_controller)->get_target_ph();
      set_action:
        - lambda: |-
            id(pool_ph_controller)->set_target_ph(x);

  - number:
      name: "Pool Volume"
      id: pool_volume_liters
      icon: "mdi:pool"
      unit_of_measurement: "L"
      min_value: 100.0
      max_value: 500000.0
      step: 10.0
      update_interval: 10s
      lambda: |-
        return id(pool_ph_controller)->get_pool_volume();
      set_action:
        - lambda: |-
            id(pool_ph_controller)->set_pool_volume(x);

  - number:
      name: "TAC"
      id: pool_tac
      icon: "mdi:water-percent"
      unit_of_measurement: "mg/L"
      min_value: 0.0
      max_value: 1000.0
      step: 1.0
      update_interval: 10s
      lambda: |-
        return id(pool_ph_controller)->get_tac();
      set_action:
        - lambda: |-
            id(pool_ph_controller)->set_tac(x);

  - number:
      name: "Acid Strength"
      id: pool_acid_strength
      icon: "mdi:flask"
      unit_of_measurement: "%"
      min_value: 1.0
      max_value: 100.0
      step: 0.1
      update_interval: 10s
      lambda: |-
        return id(pool_ph_controller)->get_acid_strength_percent();
      set_action:
        - lambda: |-
            id(pool_ph_controller)->set_acid_strength_percent(x);

  - number:
      name: "Dosing Pump Flowrate"
      id: pool_dosing_flowrate
      icon: "mdi:water-pump"
      unit_of_measurement: "mL/min"
      min_value: 1.0
      max_value: 500.0
      step: 1.0
      update_interval: 10s
      lambda: |-
        return id(pool_ph_controller)->get_dosing_flowrate();
      set_action:
        - lambda: |-
            id(pool_ph_controller)->set_dosing_flowrate(x);

  - number:
      name: "Maximum Acid Per Day"
      id: pool_max_acid_per_day
      icon: "mdi:calendar-clock"
      unit_of_measurement: "mL"
      min_value: 0.0
      max_value: 10000.0
      step: 1.0
      update_interval: 10s
      lambda: |-
        return id(pool_ph_controller)->get_max_acid();
      set_action:
        - lambda: |-
            id(pool_ph_controller)->set_max_acid(x);

  - switch:
      name: "Acid Dosing Enabled"
      id: pool_acid_dosing_enabled
      icon: "mdi:shield-check"
      optimistic: false
      lambda: |-
        return id(pool_ph_controller)->is_acid_dosing_enabled();
      turn_on_action:
        - lambda: |-
            id(pool_ph_controller)->set_acid_dosing_enabled(true);
      turn_off_action:
        - lambda: |-
            id(pool_ph_controller)->set_acid_dosing_enabled(false);

switch:
  - platform: output
    output: pool_acid_pump_output
    id: pool_pump_switch
    name: "Pool Acid Dosing Pump"
    icon: "mdi:water-pump"

text_sensor:
  - platform: template
    name: "Pool Acid Dosing Status"
    lambda: |-
      if (id(pool_ph_controller)->is_error_disabled()) {
        return "Error disabled";
      }
      return id(pool_pump_switch)->state ? "Dosing" : "Idle";
